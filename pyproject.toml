[project]
name = "musicme-partner-onboarding-mcp"
version = "0.1.1"
description = "MCP server for self-service partner onboarding on the musicme audio streaming platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "musicme / tech-leads" }]

dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
musicme-onboarding-mcp = "musicme_partner_onboarding.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicme_partner_onboarding"]
