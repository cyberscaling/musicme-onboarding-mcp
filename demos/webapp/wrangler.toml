name = "secure-audio-stream-demo"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ──────────────────────────────────────────────────────────────────────────
# Bindings shared across all environments. Vite builds the SPA into ./dist
# and Workers Static Assets serves it for non-/api/* paths.
# ──────────────────────────────────────────────────────────────────────────

[assets]
directory = "./dist"
binding = "ASSETS"
# Worker handles /api/* and /.well-known/* explicitly; the catch-all in
# src/index.ts forwards everything else to ASSETS, with index.html as the
# SPA fall-through for unknown client-side routes.
run_worker_first = true

[vars]
# Comma-separated list of "username:password" pairs. Plaintext is fine for a
# demo; gate with HTTPS only.
DEMO_USERS = "alice:wonderland,bob:builder"
JWT_TTL_SECONDS = "3600"
SESSION_TTL_SECONDS = "43200"
# Stream worker URL embedded in SPA at runtime via /api/config so we do not
# require a Vite-time env. Adjust per environment.
STREAM_WORKER_URL = "https://<your-stream-worker>.<your-subdomain>.workers.dev"
PARTNER_ID = "demo"
# `iss` is set by setup; must match the URL the JWKS is published from so
# that the stream worker can resolve the partner.
ISS_OVERRIDE = ""
# Google Cast receiver application id (Cast Developer Console). Empty = cast
# button hidden in the SPA.
CAST_APP_ID = ""

# ──────────────────────────────────────────────────────────────────────────
# DEV — Pierre@tech-leads.net (Cyberscaling). Uses the same R2/KV/Stream
# infra; runs on its own subdomain.
# ──────────────────────────────────────────────────────────────────────────
[env.dev]
account_id = "<YOUR_CLOUDFLARE_ACCOUNT_ID>"
# Custom domain — required so other Workers (= the stream worker fetching JWKS)
# can reach this Worker. Cross-Worker fetches between *.workers.dev hosts are
# blocked by Cloudflare with error 1042; a custom domain bypasses that.
routes = [
  { pattern = "demo-stream.tech-leads.cc", custom_domain = true },
]

[env.dev.observability]
enabled = true

[env.dev.vars]
DEMO_USERS = "alice:wonderland,bob:builder"
JWT_TTL_SECONDS = "3600"
SESSION_TTL_SECONDS = "43200"
STREAM_WORKER_URL = "https://<your-stream-worker>.<your-subdomain>.workers.dev"
PARTNER_ID = "demo"
# Pin `iss` to the custom domain regardless of which hostname served the
# request — keeps minted JWTs verifiable even when the SPA is loaded via the
# *.workers.dev fallback.
ISS_OVERRIDE = "https://demo-stream.tech-leads.cc"
CAST_APP_ID = ""

[env.dev.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Session KV — separate namespace from the stream worker.
[[env.dev.kv_namespaces]]
binding = "DEMO_SESSIONS"
id = "1e938f34768d43928f63da12bbf9ebc5"
preview_id = "1e938f34768d43928f63da12bbf9ebc5"

# Secrets to set via `wrangler secret put`:
#   - RSA_PRIVATE_KEY_PEM   PKCS#8 PEM (multi-line). Generate with `bun run gen-keys`.
#   - JWKS_PUBLIC_JWK       JSON-encoded public JWK (single line).
#   - SONAR_API_KEY         x-api-key header value for the tracklisting API.

# ─── BEGIN env.production (auto-generated by tools/musicme-migrate/patch-wrangler.ts) ───
[env.production]
name = "secure-audio-stream-demo"
account_id = "<YOUR_CLOUDFLARE_ACCOUNT_ID>"
routes = [
  { pattern = "demo-stream.musicme.cc", custom_domain = true },
]

[env.production.observability]
enabled = true

[env.production.vars]
DEMO_USERS = "alice:wonderland,bob:builder"
JWT_TTL_SECONDS = "3600"
SESSION_TTL_SECONDS = "43200"
STREAM_WORKER_URL = "https://secure-stream.musicme.com"
PARTNER_ID = "demo"
ISS_OVERRIDE = "https://demo-stream.musicme.cc"

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Session KV — separate namespace from the stream worker.
[[env.production.kv_namespaces]]
binding = "DEMO_SESSIONS"
id = "943aa2bf7461438a9dc1642c5649d044"

# Secrets to set via `wrangler secret put --env production`:
#   - RSA_PRIVATE_KEY_PEM   PKCS#8 PEM. Generate fresh keypair for prod.
#   - JWKS_PUBLIC_JWK       JSON-encoded public JWK (matching kid).
#   - SONAR_API_KEY         tracklisting API key.
# ─── END env.production ───
