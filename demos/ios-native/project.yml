name: SASDemoiOS
options:
  bundleIdPrefix: cc.musicme.sasdemo
  deploymentTarget:
    iOS: "17.1"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: YV33W2X58N
    CODE_SIGN_STYLE: Automatic
    WEBAPP_URL: ""

packages:
  SASCore:
    path: Packages/SASCore
  SASUI:
    path: Packages/SASUI

targets:
  SASDemoiOS:
    type: application
    platform: iOS
    sources:
      - path: SASDemoiOS
    info:
      path: SASDemoiOS/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: AccentColor
        CFBundleDisplayName: SAS Demo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WEBAPP_URL: $(WEBAPP_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.musicme.sasdemo.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: SASDemoiOS/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: SASCore
      - package: SASUI

  SASCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/SASCore/Tests/SASCoreTests
    dependencies:
      - package: SASCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.musicme.sasdemo.ios.SASCoreTests
        GENERATE_INFOPLIST_FILE: YES
